name: Keep Supabase Alive

on:
  schedule:
    # 每 12 小時執行一次 (UTC 00:00 和 12:00，即台灣時間 08:00 和 20:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支援手動觸發測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API directly
        run: |
          curl -s -o /dev/null -w "Supabase Status: %{http_code}\n" \
            -H "apikey: sb_publishable_eTT-XDiMSqrLd0H-RqJy2w_QiJyN26c" \
            -H "Authorization: Bearer sb_publishable_eTT-XDiMSqrLd0H-RqJy2w_QiJyN26c" \
            "https://lmcftpaujhdmmbiczbcu.supabase.co/rest/v1/amway_store?select=key&limit=1"

      - name: Ping Vercel Live API
        run: |
          curl -s -o /dev/null -w "Vercel API Status: %{http_code}\n" \
            "https://amway-database-n5hg.vercel.app/api/items"
